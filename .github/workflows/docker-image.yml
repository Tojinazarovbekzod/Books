name: BookCoin CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  # ───────────── 1. TEST ─────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test


  # ───────────── 2. BUILD DOCKER IMAGE ─────────────
  build:
    runs-on: ubuntu-latest
    needs: test   # TEST SUCCESS bo‘lsa keyin build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t bookcoin-app .

      - name: Tag Image
        run: |
          docker tag bookcoin-app ${{ secrets.DOCKER_USERNAME }}/bookcoin-app:latest

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/bookcoin-app:latest


  # ───────────── 3. DEPLOY ─────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build   # BUILD SUCCESS bo‘lsa deploy

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/bookcoin
            git pull origin main
            docker compose pull 
            docker compose up -d --build
