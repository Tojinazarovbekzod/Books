services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-BookCoin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qwerty12345}
      POSTGRES_USER: ${DB_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "psql", "-h", "localhost", "-U", "postgres", "-p${DB_PASSWORD:-qwerty12345}", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./django
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
    restart: unless-stopped

volumes:
  mysql_data:
